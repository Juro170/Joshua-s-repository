<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sound</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f0f0f, #1a1a40);
            font-family: 'Orbitron', sans-serif;
            color: white;
            text-align: center;
            padding-top: 40px;
        }

        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
            border: 2px solid #4af;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.05);
        }

        #playButton {
            background-color: #4af;
            color: black;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            margin-top: 20px;
        }

        #playButton:hover {
            background-color: #82cfff;
        }

        .image-box {
            margin-top: 30px;
        }

        .image-box img {
            width: 250px;
            border-radius: 15px;
            border: 3px solid #4af;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to My Sound Demo Page</h1>
        <p>Click the button below to play a sound.</p>

        <button id="playButton">Play Sound</button>

        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d" alt="Music Image 1">
            <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4" alt="Music Image 2">
        </div>

        <audio id="soundEffect" src="sound.mp3"></audio>
    </div>

    <script>
        var playButton = document.getElementById("playButton");
        var soundEffect = document.getElementById("soundEffect");

        playButton.onclick = function () {
            soundEffect.play();
            playButton.innerHTML = "Playing...";
        };
    </script>

</body>
</html>
