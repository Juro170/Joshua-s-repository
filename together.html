<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Concepts Demo</title>

    <style>
        body {
            background: linear-gradient(to bottom right, #1e1e2f, #3a3a5c);
            font-family: 'Trebuchet MS', sans-serif;
            color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 40px;
        }

        .container {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            width: 60%;
            margin: auto;
        }

        input {
            width: 90%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background: #00c3ff;
            color: black;
            font-weight: bold;
        }

        img {
            width: 100%;
            border-radius: 10px;
            margin-top: 20px;
        }

        #resultBox {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
