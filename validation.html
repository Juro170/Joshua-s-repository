<div class="container">
    <h1>User Validation</h1>

    <form id="valForm">
        <p>Enter your name (must be at least 3 characters):</p>
        <input type="text" id="nameInput" required>
        <input type="submit" value="Submit">
    </form>

    <p id="valResult"></p>
</div>

<script>
    let form = document.getElementById("valForm");
    let result = document.getElementById("valResult");

    form.onsubmit = function() {
        event.preventDefault();

        let name = document.getElementById("nameInput").value;

        if (name.length >= 3) {
            result.innerHTML = "Welcome, " + name + "!";
        } else {
            result.innerHTML = "Name must be at least 3 characters.";
        }
    };
</script>

</body>
