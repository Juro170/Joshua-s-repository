<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Checker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #1e1e2f;
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #container {
            background-color: #2e2e42;
            padding: 25px;
            border-radius: 15px;
            width: 60%;
            margin: auto;
            box-shadow: 0px 0px 15px #000;
        }

        input[type="text"] {
            padding: 10px;
            width: 70%;
            border-radius: 10px;
            border: none;
            font-size: 18px;
        }

        input[type="submit"] {
            padding: 10px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background-color: #4caf50;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        #continueBtn {
            padding: 10px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background-color: #2196f3;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        #palImg {
            width: 150px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div id="container">
        <h1>Palindrome Checker</h1>

        <img id="palImg" src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9f/Palindrome.svg/2560px-Palindrome.svg.png">

        <form id="palForm">
            <p>Enter a word or phrase:</p>
            <input type="text" id="userInput" required>
            <input type="submit" value="Check Palindrome">
        </form>

        <p id="result"></p>

        <button id="continueBtn" style="display:none;">Check Another Word</button>
    </div>

    <script>
        let form = document.getElementById("palForm");
        let result = document.getElementById("result");
        let continueBtn = document.getElementById("continueBtn");

        form.onsubmit = function() {
            event.preventDefault();
            let text = document.getElementById("userInput").value;
            let cleaned = text.replace(/\s+/g, "").toLowerCase();
            let reversed = cleaned.split("").reverse().join("");

            if (cleaned === reversed) {
                result.innerHTML = "<strong>YES!</strong> '" + text + "' is a palindrome!";
            } else {
                result.innerHTML = "<strong>NO!</strong> '" + text + "' is NOT a palindrome.";
            }

            continueBtn.style.display = "inline-block";
            form.style.display = "none";
        };

        continueBtn.onclick = function() {
            form.style.display = "block";
            document.getElementById("userInput").value = "";
            result.innerHTML = "";
            continueBtn.style.display = "none";
        };
    </script>

</body>
</html>
