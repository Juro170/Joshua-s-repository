<!DOCTYPE html>
<html>
<head>

  
    <title>Programming Concepts Demo</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

    <style>
        
        body {
            background-color: #1e1e2f;
            font-family: 'Poppins', sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }

      
        #container {
            background-color: #2e2e42;
            padding: 25px;
            border-radius: 15px;
            width: 70%;
            margin: auto;
            box-shadow: 0px 0px 15px #000;
        }

  
        input[type="text"] {
            padding: 10px;
            width: 70%;
            border-radius: 10px;
            border: none;
            font-size: 18px;
        }

        
        input[type="submit"] {
            padding: 10px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background-color: #4caf50;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        #heroImg {
            width: 200px;
            margin-top: 20px;
        }
    </style>

</head>

<body>

   
    <div id="container">

        <h1>Programming Concepts Demo</h1>

       
        <img id="heroImg" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Programming_Example.svg/2560px-Programming_Example.svg.png">

       
        <form id="mainForm">
            <p>Enter a word to analyze:</p>

          
            <input type="text" id="userInput" required>

          
            <input type="submit" value="Analyze Word">
        </form>

        
        <p id="output"></p>

    </div>

    <script>

      
        class WordAnalyzer {
            constructor(word) {
                this.word = word;
            }

            reverseWord() {
                return this.word.split("").reverse().join("");
            }

            countLetters() {
                return this.word.length;
            }

           
            isPalindrome() {
                let cleaned = this.word.replace(/\s+/g, "").toLowerCase();
                let reversed = cleaned.split("").reverse().join("");
                return cleaned === reversed;
            }
        }

        let form = document.getElementById("mainForm");
        let output = document.getElementById("output");

   
        form.onsubmit = function() {

            event.preventDefault();

            let text = document.getElementById("userInput").value;

           
            if (text.trim() === "") {
                output.innerHTML = "Please enter a valid word.";
                return;
            }

            let analyzer = new WordAnalyzer(text);

           
            let letters = analyzer.word.split("");
            let loopOutput = "";
            for (let i = 0; i < letters.length; i++) {
                loopOutput += letters[i] + " ";
            }

          
            let palindromeMessage = "";
            if (analyzer.isPalindrome()) {
                palindromeMessage = "This IS a palindrome!";
            } else {
                palindromeMessage = "This is NOT a palindrome.";
            }

            output.innerHTML =
                "<strong>Original Word:</strong> " + analyzer.word + "<br>" +
                "<strong>Reversed:</strong> " + analyzer.reverseWord() + "<br>" +
                "<strong>Letter Count:</strong> " + analyzer.countLetters() + "<br>" +
                "<strong>Loop Output:</strong> " + loopOutput + "<br>" +
                "<strong>Palindrome Check:</strong> " + palindromeMessage;
        };

    </script>

</body>
</html>
